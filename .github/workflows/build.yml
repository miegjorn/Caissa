name: Build & push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'caissa-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'sandbox/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'caissa-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'sandbox/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # caissa-core → amassada-core → fondament-core (transitive path deps).
      # Check out both upstream repos as named build contexts.
      - uses: actions/checkout@v4
        with:
          repository: miegjorn/Amassada
          path: amassada-src
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: miegjorn/Fondament
          path: fondament-src
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miegjorn/caissa
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-contexts: |
            amassada=./amassada-src
            fondament=./fondament-src
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

  build-guilhem:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}

      # caissa-core → amassada-core → fondament-core (transitive path deps,
      # resolved via real Cargo path dependencies, not just the --fondament-path
      # CLI flag below). These must land as true sibling directories of this
      # checkout, not subdirectories, for `cargo run --bin caissa` (run
      # directly on the runner, no Docker) to resolve them the same way it
      # does in local dev — hence path: ../Fondament / ../Amassada rather than
      # a plain subdirectory name.
      - uses: actions/checkout@v4
        with:
          repository: miegjorn/Fondament
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}
          ref: main
          path: ../Fondament

      - uses: actions/checkout@v4
        with:
          repository: miegjorn/Amassada
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}
          ref: main
          path: ../Amassada

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MIEGJORN_CI_TOKEN }}

      - name: Build guilhem sandbox image
        run: cargo run --bin caissa -- build guilhem --fondament-path ../Fondament

      - name: Tag and push
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c7)
          docker tag caissa-sandbox:guilhem ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA
          docker push ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA

      - name: Update guilhem chart image tag
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c7)
          sed -i "s|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-.*|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA|" \
            deploy/charts/guilhem/values.yaml
          sed -i "s|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-.*|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA|" \
            deploy/charts/component-agents/values.yaml
          git config user.name "caissa-ci"
          git config user.email "ci@miegjorn.dev"
          git add deploy/charts/guilhem/values.yaml deploy/charts/component-agents/values.yaml
          git diff --staged --quiet || git commit -m "chore(ci): update guilhem image to sha-$SHA [skip ci]"
          git pull --rebase origin main
          git push
