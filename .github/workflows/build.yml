name: Build & push

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miegjorn/caissa
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}

  build-guilhem:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: miegjorn/Fondament
          token: ${{ secrets.MIEGJORN_CI_TOKEN }}
          ref: main
          path: Fondament

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build guilhem sandbox image
        run: cargo run --bin caissa -- build guilhem --fondament-path ./Fondament

      - name: Tag and push
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c7)
          docker tag caissa-sandbox:guilhem ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA
          docker push ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA

      - name: Update guilhem chart image tag
        run: |
          SHA=$(echo "${{ github.sha }}" | head -c7)
          sed -i "s|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-.*|image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-$SHA|" \
            deploy/charts/guilhem/values.yaml
          git config user.name "caissa-ci"
          git config user.email "ci@miegjorn.dev"
          git add deploy/charts/guilhem/values.yaml
          git diff --staged --quiet || git commit -m "chore(ci): update guilhem image to sha-$SHA [skip ci]"
          git push
