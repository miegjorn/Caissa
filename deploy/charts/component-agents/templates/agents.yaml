{{- range .Values.agents }}
---
# ── {{ .name }} component agent ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-agent-caissa
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
data:
  caissa.toml: |
    [caissa]
    farga_url = {{ $.Values.farga.url | quote }}
    project = {{ .name | quote }}
    pii_patterns = ["email", "phone"]
    workspaces_dir = "workspaces"
    fondament_path = "/fondament"
    fondament_url = {{ $.Values.fondament.url | quote }}
    generation = "{{ .name }}-agent"
    farga_mcp_url = {{ $.Values.farga.url | quote | replace "\"" "" | printf "%s/mcp" | quote }}
    dispatcher_mcp_url = "http://dispatcher.agents.svc.cluster.local:9090/mcp"
    nervi_mcp_url = "http://nervi.occitan-system.svc.cluster.local:8080/mcp"
    charradissa_mcp_url = "http://charradissa.occitan-system.svc.cluster.local:8448/mcp"
    chronicle_model = "claude-haiku-4-5-20251001"

    [sandbox]
    image = "caissa-sandbox:latest"
    network = "none"
    memory_limit = "2g"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}-agent
        occitan/component: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Pull GitHub/GitLab tokens from OpenBao so the agent can use git/gh.
        - name: fetch-tokens
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
              GL=$(bao kv get -field=value secret/occitan/gitlab)
              umask 077
              bao kv get -field=value secret/occitan/github-app-id > /creds/github-app-id
              bao kv get -field=value secret/occitan/github-app-installation-id > /creds/github-app-installation-id
              bao kv get -field=value secret/occitan/github-app-private-key > /creds/github-app-private-key.pem
              cat > /creds/tokens.env <<EOF
              export GITLAB_TOKEN='$GL'
              export GITLAB_PAT_TOKEN='$GL'
              EOF
              bao kv get -field=value secret/occitan/matrix/{{ .name }}-password > /tmp/matrix-password 2>/dev/null || echo -n "" > /tmp/matrix-password
              cat >> /creds/tokens.env <<EOF
              export MATRIX_PASSWORD='$(cat /tmp/matrix-password)'
              EOF
              echo "tokens written"
          env:
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: {{ .name }}-agent
          image: {{ $.Values.image }}
          # $.Values.image is sha-tagged (immutable) — IfNotPresent avoids a
          # redundant registry round-trip on every rollout.
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /creds/tokens.env ] && . /creds/tokens.env
              . /usr/local/bin/mint-github-token.sh
              if [ -f /creds/github-app-id ]; then
                mint_installation_token || echo "[{{ .name }}-agent] continuing without a fresh GitHub token" >&2
                (while true; do sleep 2700; mint_installation_token || echo "[{{ .name }}-agent] token refresh failed, will retry next cycle" >&2; done) &
              fi
              # Regenerate CLAUDE.md live from fondament-server on every pod
              # start. The image-build-time bake is guilhem's own persona for
              # every component agent (all 9 pods share one image) — without
              # this, a component agent's CLAUDE.md is simply wrong.
              curl -s --max-time 10 "$FONDAMENT_URL/raw/fondament/{{ .name }}-agent" 2>/dev/null \
                | awk '/^context: \|/{flag=1; next} flag && /^[a-zA-Z_]+:/{flag=0} flag{print substr($0,3)}' \
                > /root/.claude/CLAUDE.md.new 2>/dev/null
              if [ -s /root/.claude/CLAUDE.md.new ]; then
                mv /root/.claude/CLAUDE.md.new /root/.claude/CLAUDE.md
              else
                echo "[{{ .name }}-agent] fondament-server unreachable at startup — keeping image-baked (guilhem) CLAUDE.md" >&2
                rm -f /root/.claude/CLAUDE.md.new
              fi
              exec caissa listen --port 8080
          env:
            - name: FARGA_URL
              value: {{ $.Values.farga.url | quote }}
            - name: FARGA_PROJECT
              value: {{ .name | quote }}
            - name: FONDAMENT_URL
              value: {{ $.Values.fondament.url | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
            - name: NATS_URL
              value: {{ $.Values.nats.url | quote }}
            - name: KROKI_URL
              value: "http://kroki.occitan-system.svc.cluster.local:8000"
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
            - name: creds
              mountPath: /creds
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: caissa-config
          configMap:
            name: {{ .name }}-agent-caissa
        - name: creds
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}-agent
  ports:
    # Charradissa calls this endpoint to dispatch messages from the component room.
    - port: 8080
      targetPort: 8080
      name: webhook
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-issue-sync
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-issue-sync
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Clean up job (and its pods) 1h after finishing -- failed pods from a
      # transient connection blip (e.g. guilhem redeploying) used to linger
      # indefinitely with no TTL set.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: fetch-tokens
              image: openbao/openbao:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
                  umask 077
                  bao kv get -field=value secret/occitan/github-app-id > /creds/github-app-id
                  bao kv get -field=value secret/occitan/github-app-installation-id > /creds/github-app-installation-id
                  bao kv get -field=value secret/occitan/github-app-private-key > /creds/github-app-private-key.pem
                  echo "tokens written"
              env:
                - name: BAO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openbao
                      key: token
              volumeMounts:
                - name: creds
                  mountPath: /creds
          containers:
            - name: issue-sync
              image: {{ $.Values.issueSyncImage }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  apt-get update -q && apt-get install -y gh curl python3
                  [ -f /creds/tokens.env ] && . /creds/tokens.env
                  set -eu
                  COMPONENT="{{ .name }}"
                  REPO="miegjorn/{{ .name | title }}"
                  NERVI_MCP="http://nervi.occitan-system.svc.cluster.local:8080/mcp"
                  SUBJECT="occitan.issues.${COMPONENT}"
                  echo "Syncing issues from ${REPO} to ${SUBJECT}"

                  # Only fetch issues created or updated in the last 25 hours so the
                  # daily CronJob doesn't re-queue stale work the agent already processed.
                  # 25h (not 24h) gives a one-hour overlap to survive scheduling jitter.
                  SINCE=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                       || date -u -v-25H +%Y-%m-%dT%H:%M:%SZ)
                  echo "Fetching issues updated since ${SINCE}"

                  # gh api supports the GitHub `since` query param (updated_at >= since).
                  ISSUES=$(gh api \
                    "repos/${REPO}/issues?state=open&since=${SINCE}&per_page=50" \
                    --jq '[.[] | select(.pull_request == null) | {number,title,body,labels,url}]' \
                    2>/dev/null || echo "[]")

                  COUNT=$(echo "${ISSUES}" | python3 -c "import json,sys; d=sys.stdin.read(); print(len(json.loads(d, strict=False)) if d.strip() else 0)")
                  echo "Found ${COUNT} open issues"

                  # Publish each issue individually to NATS via Nervi MCP
                  echo "${ISSUES}" | python3 -c "
                  import json, sys, urllib.request, urllib.error
                  raw = sys.stdin.read()
                  issues = json.loads(raw, strict=False) if raw.strip() else []
                  nervi = sys.argv[1]
                  subject = sys.argv[2]
                  for issue in issues:
                      payload = json.dumps(issue)
                      body = json.dumps({
                          'jsonrpc': '2.0', 'id': 1, 'method': 'tools/call',
                          'params': {'name': 'nervi_publish', 'arguments': {'subject': subject, 'payload': payload}}
                      }).encode()
                      req = urllib.request.Request(nervi, data=body, headers={'Content-Type': 'application/json'}, method='POST')
                      try:
                          resp = urllib.request.urlopen(req, timeout=10)
                          print(f'Published issue #{issue[\"number\"]}: {issue[\"title\"][:50]}')
                      except Exception as e:
                          print(f'Failed to publish issue #{issue[\"number\"]}: {e}', file=sys.stderr)
                  " "${NERVI_MCP}" "${SUBJECT}"

                  echo "Issue sync complete for ${COMPONENT}"
              volumeMounts:
                - name: creds
                  mountPath: /creds
          volumes:
            - name: creds
              emptyDir:
                medium: Memory
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- range $.Values.agents }}
---
# Weekly code scan + doc reconciliation for {{ .name }}.
# Fires Sunday 02:00 UTC — before Monday 04:00 Cartulari harvest so any README
# PRs opened by the scan are visible to Cartulari's next run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-scan
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-scan
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # Clean up job (and its pods) 1h after finishing -- failed pods from a
      # transient connection blip (e.g. guilhem redeploying) used to linger
      # indefinitely with no TTL set.
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scan-trigger
              image: curlimages/curl:8.11.0
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "60"
                - -X
                - POST
                - http://{{ .name }}-agent.agents.svc.cluster.local:8080/trigger/scan
                - -H
                - "Content-Type: application/json"
                - -d
                - '{"reason":"scheduled weekly code scan"}'
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
---
# Weekly context ingestion — seeds Farga's role-scoped context graph for {{ .name }}.
# Fires Sunday 03:00 UTC — after scan (02:00) and before the weekly dream (03:30).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-ingest
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-ingest
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # Clean up job (and its pods) 1h after finishing -- failed pods from a
      # transient connection blip (e.g. guilhem redeploying) used to linger
      # indefinitely with no TTL set.
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: fetch-tokens
              image: openbao/openbao:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
                  umask 077
                  bao kv get -field=value secret/occitan/github-app-id > /creds/github-app-id
                  bao kv get -field=value secret/occitan/github-app-installation-id > /creds/github-app-installation-id
                  bao kv get -field=value secret/occitan/github-app-private-key > /creds/github-app-private-key.pem
              env:
                - name: BAO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openbao
                      key: token
              volumeMounts:
                - name: creds
                  mountPath: /creds
          containers:
            - name: ingest
              image: {{ $.Values.image }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  [ -f /creds/tokens.env ] && . /creds/tokens.env
                  . /usr/local/bin/mint-github-token.sh
                  [ -f /creds/github-app-id ] && { mint_installation_token || echo "[ingest] continuing without a fresh GitHub token" >&2; }
                  exec caissa ingest --component {{ .name }}
              env:
                - name: FARGA_URL
                  value: {{ $.Values.farga.url | quote }}
                - name: FARGA_PROJECT
                  value: {{ .name | quote }}
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: anthropic
                      key: api-key
              volumeMounts:
                - name: caissa-config
                  mountPath: /workspace/caissa.toml
                  subPath: caissa.toml
                  readOnly: true
                - name: creds
                  mountPath: /creds
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: caissa-config
              configMap:
                name: {{ .name }}-agent-caissa
            - name: creds
              emptyDir:
                medium: Memory
{{- end }}
