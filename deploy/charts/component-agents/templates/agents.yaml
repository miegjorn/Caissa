{{- range .Values.agents }}
---
# ── {{ .name }} component agent ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-agent-caissa
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
data:
  caissa.toml: |
    [caissa]
    farga_url = {{ $.Values.farga.url | quote }}
    project = {{ .name | quote }}
    pii_patterns = ["email", "phone"]
    workspaces_dir = "workspaces"
    fondament_path = "/fondament"
    generation = "{{ .name }}-agent"
    farga_mcp_url = {{ $.Values.farga.url | quote | replace "\"" "" | printf "%s/mcp" | quote }}
    dispatcher_mcp_url = "http://dispatcher.agents.svc.cluster.local:9090/mcp"
    chronicle_model = "claude-haiku-4-5-20251001"

    [sandbox]
    image = "caissa-sandbox:latest"
    network = "none"
    memory_limit = "2g"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}-agent
        occitan/component: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Pull GitHub/GitLab tokens from OpenBao so the agent can use git/gh.
        - name: fetch-tokens
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
              GH=$(bao kv get -field=value secret/occitan/github)
              GL=$(bao kv get -field=value secret/occitan/gitlab)
              umask 077
              cat > /creds/tokens.env <<EOF
              export GH_TOKEN='$GH'
              export GITHUB_TOKEN='$GH'
              export GITLAB_TOKEN='$GL'
              export GITLAB_PAT_TOKEN='$GL'
              EOF
              echo "tokens written"
          env:
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: {{ .name }}-agent
          image: {{ $.Values.image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /creds/tokens.env ] && . /creds/tokens.env
              exec caissa listen --port 8080
          env:
            - name: FARGA_URL
              value: {{ $.Values.farga.url | quote }}
            - name: FARGA_PROJECT
              value: {{ .name | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
            - name: creds
              mountPath: /creds
            - name: fondament-defs
              mountPath: /fondament/definitions/fondament
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: caissa-config
          configMap:
            name: {{ .name }}-agent-caissa
        - name: creds
          emptyDir:
            medium: Memory
        - name: fondament-defs
          configMap:
            name: fondament-component-defs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}-agent
  ports:
    # Charradissa calls this endpoint to dispatch messages from the component room.
    - port: 8080
      targetPort: 8080
      name: webhook
{{- end }}
