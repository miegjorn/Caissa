{{- range .Values.agents }}
---
# ── {{ .name }} component agent ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-agent-caissa
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
data:
  caissa.toml: |
    [caissa]
    farga_url = {{ $.Values.farga.url | quote }}
    project = {{ .name | quote }}
    pii_patterns = ["email", "phone"]
    workspaces_dir = "workspaces"
    fondament_path = "/fondament"
    generation = "{{ .name }}-agent"
    farga_mcp_url = {{ $.Values.farga.url | quote | replace "\"" "" | printf "%s/mcp" | quote }}
    dispatcher_mcp_url = "http://dispatcher.agents.svc.cluster.local:9090/mcp"
    nervi_mcp_url = "http://nervi.occitan-system.svc.cluster.local:8080/mcp"
    chronicle_model = "claude-haiku-4-5-20251001"

    [sandbox]
    image = "caissa-sandbox:latest"
    network = "none"
    memory_limit = "2g"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}-agent
        occitan/component: {{ .name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Pull GitHub/GitLab tokens from OpenBao so the agent can use git/gh.
        - name: fetch-tokens
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
              GH=$(bao kv get -field=value secret/occitan/github)
              GL=$(bao kv get -field=value secret/occitan/gitlab)
              umask 077
              cat > /creds/tokens.env <<EOF
              export GH_TOKEN='$GH'
              export GITHUB_TOKEN='$GH'
              export GITLAB_TOKEN='$GL'
              export GITLAB_PAT_TOKEN='$GL'
              EOF
              echo "tokens written"
          env:
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: {{ .name }}-agent
          image: {{ $.Values.image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /creds/tokens.env ] && . /creds/tokens.env
              exec caissa listen --port 8080
          env:
            - name: FARGA_URL
              value: {{ $.Values.farga.url | quote }}
            - name: FARGA_PROJECT
              value: {{ .name | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
            - name: creds
              mountPath: /creds
            - name: fondament-defs
              mountPath: /fondament/definitions/fondament
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      volumes:
        - name: caissa-config
          configMap:
            name: {{ .name }}-agent-caissa
        - name: creds
          emptyDir:
            medium: Memory
        - name: fondament-defs
          configMap:
            name: fondament-component-defs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-agent
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}-agent
  ports:
    # Charradissa calls this endpoint to dispatch messages from the component room.
    - port: 8080
      targetPort: 8080
      name: webhook
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-issue-sync
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-issue-sync
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: fetch-tokens
              image: openbao/openbao:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
                  GH=$(bao kv get -field=value secret/occitan/github)
                  umask 077
                  cat > /creds/tokens.env <<EOF
                  export GH_TOKEN='$GH'
                  export GITHUB_TOKEN='$GH'
                  EOF
                  echo "tokens written"
              env:
                - name: BAO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: openbao
                      key: token
              volumeMounts:
                - name: creds
                  mountPath: /creds
          containers:
            - name: issue-sync
              image: ghcr.io/cli/cli:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  [ -f /creds/tokens.env ] && . /creds/tokens.env
                  set -eu
                  COMPONENT="{{ .name }}"
                  REPO="miegjorn/{{ .name | title }}"
                  NERVI_MCP="http://nervi.occitan-system.svc.cluster.local:8080/mcp"
                  SUBJECT="occitan.issues.${COMPONENT}"
                  echo "Syncing issues from ${REPO} to ${SUBJECT}"

                  # Fetch open issues as JSON
                  ISSUES=$(gh issue list --repo "${REPO}" --state open \
                    --json number,title,body,labels,url --limit 50 2>/dev/null || echo "[]")

                  COUNT=$(echo "${ISSUES}" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
                  echo "Found ${COUNT} open issues"

                  # Publish each issue individually to NATS via Nervi MCP
                  echo "${ISSUES}" | python3 -c "
                  import json, sys, urllib.request, urllib.error
                  issues = json.load(sys.stdin)
                  nervi = sys.argv[1]
                  subject = sys.argv[2]
                  for issue in issues:
                      payload = json.dumps(issue)
                      body = json.dumps({
                          'jsonrpc': '2.0', 'id': 1, 'method': 'tools/call',
                          'params': {'name': 'nervi_publish', 'arguments': {'subject': subject, 'payload': payload}}
                      }).encode()
                      req = urllib.request.Request(nervi, data=body, headers={'Content-Type': 'application/json'}, method='POST')
                      try:
                          resp = urllib.request.urlopen(req, timeout=10)
                          print(f'Published issue #{issue[\"number\"]}: {issue[\"title\"][:50]}')
                      except Exception as e:
                          print(f'Failed to publish issue #{issue[\"number\"]}: {e}', file=sys.stderr)
                  " "${NERVI_MCP}" "${SUBJECT}"

                  echo "Issue sync complete for ${COMPONENT}"
              volumeMounts:
                - name: creds
                  mountPath: /creds
          volumes:
            - name: creds
              emptyDir:
                medium: Memory
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- range $.Values.agents }}
---
# Weekly code scan + doc reconciliation for {{ .name }}.
# Fires Sunday 02:00 UTC — before Monday 04:00 Cartulari harvest so any README
# PRs opened by the scan are visible to Cartulari's next run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}-scan
  namespace: agents
  labels:
    app.kubernetes.io/name: {{ .name }}-scan
    app.kubernetes.io/part-of: occitan
    occitan/component: {{ .name }}
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scan-trigger
              image: curlimages/curl:8.11.0
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "60"
                - -X
                - POST
                - http://{{ .name }}-agent.agents.svc.cluster.local:8080/trigger/scan
                - -H
                - "Content-Type: application/json"
                - -d
                - '{"reason":"scheduled weekly code scan"}'
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
{{- end }}
