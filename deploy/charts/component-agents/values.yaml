# caissa binary image used for all component agent pods.
# Same binary as Guilhem — only the Farga project context differs.
image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-779ccfc

# Image for issue-sync CronJobs. Must have: gh, curl, sh.
# ghcr.io/cli/cli never published Docker images — ubuntu:22.04 has gh in apt.
issueSyncImage: ubuntu:22.04

imagePullSecrets:
  - name: ghcr-creds

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

farga:
  url: "http://farga.occitan-system.svc.cluster.local:7500"

nervi:
  mcpUrl: "http://nervi.occitan-system.svc.cluster.local:8080/mcp"

# One entry per Occitan component.
# - name:   component identifier, becomes the Farga project and pod name
# - roomId: Matrix room ID this agent inhabits (room already exists in Synapse)
agents:
  - name: gardian
    roomId: "!bwuKXFvUXnVZfXcKuz:occitane.guilhem"
  - name: fondament
    roomId: "!KuWBSmYyvyiyTMFKqJ:occitane.guilhem"
  - name: farga
    roomId: "!CtktMiOTNtSIkdwOxq:occitane.guilhem"
  - name: amassada
    roomId: "!vLjgiURMSlkqTXgaDG:occitane.guilhem"
  - name: cor
    roomId: "!FgfTbZMpLLVGiISZTj:occitane.guilhem"
  - name: caissa
    roomId: "!ZqGBDioAYnOATihiEU:occitane.guilhem"
  - name: charradissa
    roomId: "!qZGQFrjAcKjPinhQnp:occitane.guilhem"
  - name: nervi
    roomId: "!QQeweqsLsOTZYdonXi:occitane.guilhem"
