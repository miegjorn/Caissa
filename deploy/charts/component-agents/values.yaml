# caissa binary image used for all component agent pods.
# Same binary as Guilhem — only the Farga project context differs.
image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-1c8810a

# Image for issue-sync CronJobs. Must have: gh, curl, sh.
# ghcr.io/cli/cli never published Docker images — ubuntu:22.04 has gh in apt.
issueSyncImage: ubuntu:22.04

imagePullSecrets:
  - name: ghcr-creds

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

farga:
  url: "http://farga.occitan-system.svc.cluster.local:7500"

fondament:
  # fondament-server — resolved live at runtime, not a vendored local copy.
  # See caissa_core::agent::fetch_fondament_def.
  url: "http://fondament.occitan-system.svc.cluster.local:7800"

nervi:
  mcpUrl: "http://nervi.occitan-system.svc.cluster.local:8080/mcp"

nats:
  url: "nats://nervi-nats.occitan-system.svc.cluster.local:4222"

# One entry per Occitan component.
# - name: component identifier, becomes the Farga project and pod name
agents:
  - name: gardian
  - name: fondament
  - name: farga
  - name: amassada
  - name: cor
  - name: caissa
  - name: charradissa
  - name: nervi
