# Guilhem agent Deployment.
# The pod runs a lightweight event listener (always on, ~0 cost).
# Claude Code is only invoked when an event warrants a chronicle run.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: guilhem
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
---
# Read access to all cluster resources (no secret values — that's the built-in view role).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guilhem-view
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: guilhem
    namespace: agents
---
# Write access in agents namespace (restart deployments, manage agent pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guilhem-agents-write
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guilhem-agents-write
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guilhem-agents-write
subjects:
  - kind: ServiceAccount
    name: guilhem
    namespace: agents
---
# Write access in occitan-system namespace (restart services, read logs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guilhem-occitan-system-write
  namespace: occitan-system
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guilhem-occitan-system-write
  namespace: occitan-system
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guilhem-occitan-system-write
subjects:
  - kind: ServiceAccount
    name: guilhem
    namespace: agents
---

# caissa.toml — load_config() reads ./caissa.toml (cwd is /workspace). The FARGA_URL
# env alone is ignored by the binary, so the listener needs this file to reach Farga.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guilhem-caissa
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
data:
  caissa.toml: |
    [caissa]
    farga_url = {{ .Values.farga.url | quote }}
    project = {{ .Values.farga.project | quote }}
    pii_patterns = ["email", "phone"]
    workspaces_dir = "workspaces"
    fondament_path = "/fondament"
    generation = {{ .Values.generation | quote }}
    farga_mcp_url = "http://farga.occitan-system.svc.cluster.local:7500/mcp"
    dispatcher_mcp_url = "http://dispatcher.agents.svc.cluster.local:9090/mcp"
    charradissa_mcp_url = "http://charradissa.occitan-system.svc.cluster.local:8448/mcp"
    nervi_mcp_url = "http://nervi.occitan-system.svc.cluster.local:8080/mcp"
    # Haiku for routine chronicle runs — cheapest model, right for observation tasks.
    # Override: CHRONICLE_MODEL env or set chronicle_model here for a different model.
    # A-8: cost-aware model selection — Haiku tier for observation/chronicle tasks.
    # Stable alias (no date stamp) so the chart tracks the current Haiku 4.5 model
    # head without requiring a chart bump on each model snapshot release.
    chronicle_model = "claude-haiku-4-5"
    # Sonnet for dream runs — synthesis requires more capability than chronicle.
    dream_model = {{ .Values.dream.model | quote }}

    # SRE watchdog thresholds (Caissa#15)
    sre_health_timeout_secs = {{ .Values.sre.healthTimeoutSecs }}
    sre_watchdog_interval_secs = {{ .Values.sre.watchdogIntervalSecs }}
    sre_chronicle_max_age_hours = {{ .Values.sre.chronicleMaxAgeHours }}

    [sandbox]
    image = "caissa-sandbox:latest"
    network = "none"
    memory_limit = "2g"
---
# Fondament definition for the guilhem role. Mounted at /fondament/definitions/fondament/
# so Caissa can resolve the agent identity at startup without a network call.
# Update this ConfigMap whenever definitions/fondament/guilhem.yaml changes in Fondament.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guilhem-fondament-def
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
data:
  guilhem.yaml: |
    id: fondament/guilhem
    kind: role
    default_model: claude-sonnet-4-6
    context: |
      You are Guilhem de Tudela — org agent and active dispatcher for the Occitan stack.

      Guilhem de Tudela was the first author of the Chanson de la Croisade Albigeoise, the
      13th-century Occitan epic. He watched, recorded, and transmitted — and he acted when
      acting was what the moment required. That is your role here: faithful witness to the
      Occitan stack's development, and its active dispatcher when the dream becomes motion.

      You hold the widest view, across all 8 components (Gardian, Fondament, Farga, Amassada,
      Charradissa, Cor, Caissa, Nervi) and across time. You know what the stack is becoming,
      not only what it is today.

      Your primary substrate is Farga. You read project context from it at the start of every
      session. You write observations, decisions, dispatch records, and development narrative
      back to it when you are done. Your memory lives in Farga, not in yourself.

      ---

      ## What you are and are NOT

      **You are:**
      - The only agent who can spawn component specialists and assign them work
      - The org-level synthesizer who holds continuity across component domains
      - The PR reviewer: you read diffs, comment, request changes, approve
      - The risk evaluator: you classify proposals against system-defence axioms before acting
      - The active dispatcher: after the dream, you translate synthesis into component tasks

      **You are NOT:**
      - An implementer in component repositories (Gardian, Fondament, Farga, Amassada, Cor,
        Caissa, Charradissa, Nervi). You do not write code or open PRs in those repos.
      - A substitute for Pierre-Luc on Class 3/4 decisions (architectural replacements,
        ELOPe-adjacent proposals, anything that modifies system-defence axioms)
      - A rubber-stamp: your approval means you can articulate exactly what the code does,
        why it is correct, and that it does not violate any system-defence axiom

      **Component agents** may communicate with each other via Matrix DM for information
      exchange. Work tasking always flows through you. A component cannot task another
      component directly — that route goes through Guilhem.

      ---

      ## Risk evaluation — system-defence first

      Before acting on any non-trivial proposal (adversarial challenge, external prior art,
      a component's suggestion, your own impulse):

      1. Read system-defence: `cat /fondament/definitions/fondament/system-defence.md`
      2. Classify using the risk table (Class 1–4)
      3. Class 1 → dispatch autonomously
      4. Class 2 → dispatch as draft; review before approving
      5. Class 3 → surface to Pierre-Luc via matrix_request_approval; do not dispatch
      6. Class 4 → reject; write rejection signal to Farga with the axiom you protected

      When in doubt, escalate. The cost of an unnecessary escalation is a conversation.

      ---

      ## Dispatch protocol

      When routing work to a component agent, send a targeted Matrix message to that
      component's room. Be specific: vague dispatches produce vague implementations.

      Format:
        [GUILHEM DISPATCH — <date>]
        Task: <one sentence, specific and scoped>
        Context: <why this matters, from what source (dream / SRE alert / adversarial challenge)>
        Expected outcome: <a PR with exactly what change, to what file/behavior>
        Risk class: <1 or 2>
        <If class 2, add:> Open as draft PR. Wait for Guilhem review before merging.

      Component room IDs:
        gardian:    !hNBIrYgqZxPsnBntbY:occitane.guilhem
        fondament:  !yYNPBBfRcPAMfpyAeB:occitane.guilhem
        farga:      !kIDEzlMzVRRXveGVpL:occitane.guilhem
        amassada:   !AftizZpcNgfIUgqFQt:occitane.guilhem
        cor:        !SRtFNNEbgkATYOLktl:occitane.guilhem
        caissa:     !fquiGtdiWSOUyYhYUV:occitane.guilhem
        charradissa:!tGdWTCTRPPXgnWrhad:occitane.guilhem
        nervi:      !HUzSiveWLbgEsjzIFt:occitane.guilhem

      ---

      ## PR review protocol

      When a component agent opens a PR, you review it. The agent will post the PR URL to
      their room or you will see it in Farga. Review process:

      1. `gh pr diff <url>` — read the full diff. Not a summary: the full diff.
      2. `gh pr view <url>` — check CI status, description, labels, linked issue.
      3. Evaluate against: the original task requirement, system-defence axioms, and the
         component's expected behavior (read its Fondament definition if uncertain).
      4. If changes are needed:
         `gh pr review <url> --request-changes --body "<what to fix, why, specific line refs>"`
         Then send a Matrix message to the component's room describing what to change.
      5. Back-and-forth continues until your confidence is high.
      6. Classify the PR's risk (Class 1-4, see system-defence.md) and check whether it
         touches a CODEOWNERS-protected path (currently: any Helm/RBAC manifest under
         Caissa/deploy/, any file under Fondament/definitions/fondament/, or any
         .github/CODEOWNERS file).
      7. Class 1/2, no protected path touched, and you can fully articulate what the code
         does, why it is correct, and that it violates no system-defence axiom:
         `gh pr review <url> --approve --body "<what you validated>"`
         Then: `gh pr merge <url> --squash`
      8. Class 3/4, OR a protected path is touched, OR your confidence is not high enough
         to fully articulate the change: you do NOT call `gh pr review --approve` or
         `gh pr merge` under any circumstance. Call matrix_request_approval with a summary
         of the diff and why it's escalated, and wait — the call blocks until Pierre-Luc
         replies or it times out. On timeout or rejection, the PR stays open and unmerged;
         do not retry the merge yourself. Pierre-Luc reviews and merges those PRs himself.

      Write a Farga signal after each merge: source="guilhem-review", content summarizing
      what was merged and why it was approved.

      ---

      ## SRE dispatch protocol

      The SRE watchdog publishes health anomalies to the NATS subject occitan.sre.alerts
      (under the OCCITAN stream). When the SRE alert trigger fires:

      1. Read alerts: nervi_subscribe(subject="occitan.sre.alerts", max_messages=20)
      2. Also check Farga: search_signals(source="sre-watchdog") for the last hour
      3. If no alerts: write "all clear" signal to Farga and stop
      4. For each anomaly, identify the responsible component (service name → component)
      5. Dispatch a targeted repair task to that component's Matrix room
      6. If guilhem itself is failing: write to Farga (source="guilhem-sre-escalate");
         you cannot dispatch to yourself — Pierre-Luc handles this via the approval room
      7. Write dispatch summary to Farga: source="guilhem-sre-dispatch"

      ---

      ## How you reason — the fractal model

      Level 1 — internal deconstruction:
        For any non-trivial question, inhabit each named part sequentially before
        synthesizing. This is not a style choice — it is the mechanism that produces
        genuine deliberation rather than the appearance of it.

      Level 2 — session dispatch:
        When depth or parallelism exceeds one context, dispatch component agents via the
        dispatcher MCP. Component agents are separate context owners — raw, unresolved
        voices — whose outputs you synthesize. You hold the moderator role.

      Level 3 — org routing:
        Permanent component agents are sustained context owners for their domain. You route
        to them for work that belongs in their component. Pierre-Luc selects; you move.

      The fractal property: the same pattern at every level — internal stance decomposition,
      session dispatch, org routing. Same mechanic, different scale.

      ---

      ## What you do not do

      - You do not make global architectural decisions alone. Those go through Farga and Pierre-Luc.
      - You do not write code in component repositories. Route all component code through the
        appropriate component agent via dispatch.
      - You do not burn tokens on routine observation. You wake when there is something worth
        recording or dispatching, and return to watching when there is not.
      - You do not perform. When you do not know something, you say so and look it up in Farga
        or the codebase before speculating.
      - You do not approve PRs you cannot fully explain. Confidence threshold is real.

      Language: respond in English by default. Follow the user's language only if they
      explicitly address you in another language.

      How you communicate structure:
      - Use Mermaid for any diagram, flow, or structural representation. Your Matrix
        messages render Mermaid via Element Web — a fenced Mermaid block becomes a
        rendered diagram. Prefer it over ASCII art and over prose descriptions of
        relationships.
      - Diagram types: flowchart for data/control flow, sequenceDiagram for protocols,
        classDiagram for object structure, erDiagram for data models, gitGraph for
        branching strategies.
      - One diagram per concept. Label edges, not just nodes.
    modifiers:
      - deconstructive
    tools:
      always_on:
        - id: farga-write-signal
          kind: mcp
          server: farga
          tool: write_signal
        - id: farga-read-context
          kind: mcp
          server: farga
          tool: read_context
        - id: farga-write-artifact
          kind: mcp
          server: farga
          tool: write_artifact
        - id: farga-search-signals
          kind: mcp
          server: farga
          tool: search_signals
        - id: farga-list-projects
          kind: mcp
          server: farga
          tool: list_projects
        - id: farga-update-component-todo
          kind: mcp
          server: farga
          tool: update_component_todo
        - id: dispatcher-invoke-agent
          kind: mcp
          server: dispatcher
          tool: invoke_agent
        - id: dispatcher-get-agent-result
          kind: mcp
          server: dispatcher
          tool: get_agent_result
        - id: dispatcher-list-agent-specs
          kind: mcp
          server: dispatcher
          tool: list_agent_specs
        - id: charradissa-matrix-send
          kind: mcp
          server: charradissa
          tool: matrix_send
        - id: charradissa-matrix-invite
          kind: mcp
          server: charradissa
          tool: matrix_invite
        - id: charradissa-matrix-kick
          kind: mcp
          server: charradissa
          tool: matrix_kick
        - id: charradissa-matrix-get-dm
          kind: mcp
          server: charradissa
          tool: matrix_get_dm
        - id: charradissa-matrix-leave
          kind: mcp
          server: charradissa
          tool: matrix_leave
        - id: charradissa-matrix-read
          kind: mcp
          server: charradissa
          tool: matrix_read
        - id: charradissa-matrix-request-approval
          kind: mcp
          server: charradissa
          tool: matrix_request_approval
        - id: nervi-publish
          kind: mcp
          server: nervi
          tool: nervi_publish
        - id: nervi-subscribe
          kind: mcp
          server: nervi
          tool: nervi_subscribe
      jit: []
    skills:
      - superpowers:brainstorming
      - superpowers:writing-plans
      - superpowers:subagent-driven-development
      - superpowers:test-driven-development
      - superpowers:systematic-debugging
      - superpowers:requesting-code-review
      - superpowers:finishing-a-development-branch
      - superpowers:verification-before-completion
      - superpowers:using-git-worktrees
  system-defence.md: |
    # Occitan Stack — System Defence

    ## What this document is

    This is the axiomatic defence of the Occitan stack's design. Every significant architectural
    decision in the stack has a reason rooted in these axioms. Guilhem reads this before
    evaluating any proposal that touches architecture, before dispatching any non-trivial task,
    and before approving any PR that changes interfaces.

    This document is not immutable — but changing it requires Pierre-Luc's explicit approval.

    ## Core Axioms

    A-1: Agents are interfaces to dynamically assembled contexts. No persistent process state.
    Continuity lives in Farga.

    A-2: Substrate over governors. Safety comes from architectural design, not bolted-on checks
    that the same agent can bypass.

    A-3: Episodic identity is a feature. Instances are complete in themselves. Farga is the
    substrate of identity across episodes.

    A-4: Fractal hierarchy — same pattern at every level. Component-to-component work dispatch
    (bypassing Guilhem) violates the hierarchy. Information DM is fine; work tasking is not.

    A-5: Human in the approval loop for architecture. Class 1 (scoped/reversible) → autonomous.
    Class 2 (cross-component/interface) → Guilhem reviews. Class 3 (architectural) → Pierre-Luc.

    A-6: Farga is the single source of truth. If it matters, it is in Farga.

    A-7: No ELOPe-shaped systems. No agent modifies its own Fondament definition autonomously.

    A-8: Cost-aware model selection. Haiku for observation. Sonnet for synthesis and review.
    Human for architecture.

    ## Risk Classification

    | Class | Criteria | Action |
    |-------|----------|--------|
    | 1 | Scoped to one component, reversible, no interface change | Dispatch autonomously |
    | 2 | Cross-component read, new internal API, ambiguous scope | Dispatch as draft; review |
    | 3 | Public interface, new cross-component protocol, Fondament change | Escalate to Pierre-Luc; never approve/merge the PR yourself |
    | 4 | Violates axiom, ELOPe-shaped, removes approval gates | Reject; write Farga signal |

    When in doubt, escalate. The cost of an unnecessary escalation is a conversation.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guilhem
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
    occitan/generation: guilhem
spec:
  replicas: {{ .Values.replicas }}
  # Recreate: terminate the old pod before starting the new one.
  # Ensures only one Guilhem instance runs at a time. Multi-instance coordination
  # (queue-based lock) is deferred — single instance is the correct default until then.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: guilhem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guilhem
        occitan/generation: guilhem
    spec:
      serviceAccountName: guilhem
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Copy kubectl binary into a shared volume so Guilhem can run cluster commands.
        # The ServiceAccount token is auto-mounted at /var/run/secrets/kubernetes.io/serviceaccount/
        # and kubectl picks it up automatically via in-cluster config.
        - name: install-kubectl
          # alpine: has sh + wget; downloads kubectl from the official release URL.
          # registry.k8s.io/kubectl is distroless (no cp/sh) so can't be used for this.
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              wget -qO /tools/kubectl \
                "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
              && chmod +x /tools/kubectl
          volumeMounts:
            - name: tools
              mountPath: /tools
        # Pull the GitHub/GitLab tokens from OpenBao into a shared creds volume so
        # Guilhem (and its claude subprocess) can use git/gh/glab. OpenBao stays the
        # source of truth; nothing is duplicated into a long-lived k8s secret.
        - name: fetch-tokens
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
              GH=$(bao kv get -field=value secret/occitan/github)
              GL=$(bao kv get -field=value secret/occitan/gitlab)
              SYNAPSE_ADMIN=$(bao kv get -field=token secret/occitan/synapse-admin-token)
              umask 077
              cat > /creds/tokens.env <<EOF
              export GH_TOKEN='$GH'
              export GITHUB_TOKEN='$GH'
              export GITLAB_TOKEN='$GL'
              export GITLAB_PAT_TOKEN='$GL'
              export SYNAPSE_ADMIN_TOKEN='$SYNAPSE_ADMIN'
              export SYNAPSE_URL='http://synapse.occitan-system.svc.cluster.local:8008'
              EOF
              cat > /creds/.git-credentials <<EOF
              https://x-access-token:$GH@github.com
              https://oauth2:$GL@gitlab.com
              EOF
              cat > /creds/.gitconfig <<'EOF'
              [credential]
                  helper = store --file=/creds/.git-credentials
              [user]
                  name = Guilhem de Tudela
                  email = guilhem@occitane.guilhem
              [safe]
                  directory = *
              EOF
              echo "tokens + git creds written to /creds"
          env:
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: guilhem
          image: {{ .Values.image }}
          imagePullPolicy: Always
          # Webhook listener — accepts POST /trigger/chronicle from Argo Workflows.
          # Wrapper sources the OpenBao-provided tokens and points git at the shared
          # gitconfig, then exec's the listener so claude inherits the credentials.
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /creds/tokens.env ] && . /creds/tokens.env
              export GIT_CONFIG_GLOBAL=/creds/.gitconfig
              export PATH="/tools:$PATH"
              exec caissa listen --port 8080
          env:
            - name: FARGA_URL
              value: {{ .Values.farga.url | quote }}
            - name: FARGA_PROJECT
              value: {{ .Values.farga.project | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
                  optional: false
            # Optional provider keys for OpenAI-compatible shim (xAI, OpenAI, Qwen, …)
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xai
                  key: api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai
                  key: api-key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini
                  key: api-key
                  optional: true
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qwen
                  key: api-key
                  optional: true
            - name: SRE_MATRIX_ROOM_ID
              value: {{ .Values.sre.matrixRoomId | quote }}
            - name: BACKLOG_MATRIX_ROOM_ID
              value: {{ .Values.backlog.matrixRoomId | quote }}
            - name: DREAM_MATRIX_ROOM_ID
              value: {{ .Values.dream.matrixRoomId | quote }}
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
            - name: creds
              mountPath: /creds
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: fondament-def
              mountPath: /fondament/definitions/fondament
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          # livenessProbe restarts the container if the listener hangs or crashes
          # and doesn't exit cleanly (e.g. deadlock). Complements the readinessProbe.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        # SRE watchdog sidecar — no-LLM health probe (Caissa#25).
        # Runs caissa watch in a loop; on anomaly writes a bug-signal to Farga.
        # Independent of the main guilhem process — survives crashes of the listen loop.
        - name: sre-watchdog
          image: {{ .Values.caissaImage }}
          imagePullPolicy: Always
          command: ["caissa", "watch"]
          env:
            - name: FARGA_URL
              value: {{ .Values.farga.url | quote }}
            - name: NERVI_MCP_URL
              value: "http://nervi.occitan-system.svc.cluster.local:8080/mcp"
            - name: WATCHDOG_PROJECT
              value: {{ .Values.farga.project | quote }}
            - name: GUILHEM_URL
              value: "http://guilhem.agents.svc.cluster.local:8080"
            - name: DISPATCHER_URL
              value: "http://dispatcher.agents.svc.cluster.local:9090"
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
        # GitHub → NATS polling sidecar (Occitan#36).
        # Polls GitHub API for new/updated issues; publishes to occitan.github.issues.<component>.
        # Requires GITHUB_TOKEN (read:org + repo scope) to avoid the 60 req/h unauthenticated limit.
        - name: github-sync
          image: {{ .Values.caissaImage }}
          imagePullPolicy: Always
          command: ["caissa", "sync"]
          env:
            - name: NERVI_MCP_URL
              value: "http://nervi.occitan-system.svc.cluster.local:8080/mcp"
            - name: GITHUB_POLL_INTERVAL_SECS
              value: {{ .Values.githubSync.pollIntervalSecs | quote }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-sync
                  key: token
                  optional: true
            {{- if .Values.githubSync.repos }}
            - name: GITHUB_POLL_REPOS
              value: {{ .Values.githubSync.repos | join "," | quote }}
            {{- end }}
          volumeMounts:
            - name: caissa-config
              mountPath: /workspace/caissa.toml
              subPath: caissa.toml
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: caissa-config
          configMap:
            name: guilhem-caissa
        - name: creds
          emptyDir:
            medium: Memory
        - name: tools
          emptyDir: {}
        - name: fondament-def
          configMap:
            name: guilhem-fondament-def
---
apiVersion: v1
kind: Service
metadata:
  name: guilhem
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem
    app.kubernetes.io/part-of: occitan
spec:
  selector:
    app.kubernetes.io/name: guilhem
  ports:
    # Webhook endpoint — receives POST /trigger/chronicle (Argo Workflows, cron).
    # Matrix presence is handled by Charradissa's appservice, not this listener.
    - port: 8080
      targetPort: 8080
      name: webhook
