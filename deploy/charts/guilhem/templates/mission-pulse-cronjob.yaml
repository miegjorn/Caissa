{{- if .Values.missionPulse.schedule }}
# Weekly mission pulse — Guilhem sets stack direction and manages the Initiative→Epic hierarchy.
# Fires Monday 05:00 UTC: after the weekend's dream+dispatch cycle, before the week's work begins.
# Creates GitHub Initiatives for new stack directions, consults component architect facets to
# decompose Initiatives into Epics, and writes a mission summary to Farga.
# Component agents consume Epics via the daily issue-sync Nervi feed (06:00 UTC same day).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: guilhem-mission-pulse
  namespace: agents
  labels:
    app.kubernetes.io/name: guilhem-mission-pulse
    app.kubernetes.io/part-of: occitan
spec:
  schedule: {{ .Values.missionPulse.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mission-pulse-trigger
              image: curlimages/curl:8.11.0
              command:
                - curl
                - --fail
                - --silent
                - --show-error
                - --max-time
                - "60"
                - -X
                - POST
                - http://guilhem.agents.svc.cluster.local:8080/trigger/mission-pulse
                - -H
                - "Content-Type: application/json"
                - -d
                - '{"reason":"weekly mission pulse"}'
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
{{- end }}
