# Guilhem agent chart values.
# Image is built by: caissa build guilhem

image: caissa-sandbox:guilhem
# caissa listen is implemented — Guilhem is alive (event listener, ~0 idle cost).
replicas: 1

farga:
  url: "http://farga.occitan-system.svc.cluster.local:7500"
  project: occitan

matrix:
  homeserver: "http://synapse.occitan-system.svc.cluster.local:8008"
  serverName: occitane.guilhem

# Chronicle schedule — how often Guilhem wakes to observe and record.
# Uses Argo Workflows CronWorkflow syntax (standard cron).
# Kept infrequent to avoid token burn on quiet periods.
chronicleSchedule: "0 */6 * * *"   # every 6 hours

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
