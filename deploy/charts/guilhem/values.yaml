# Guilhem agent chart values.
# Image is built by: caissa build guilhem

image: ghcr.io/miegjorn/caissa-sandbox:guilhem-sha-7da7fd3 # CI writes sha-tagged value here
# Lean CLI image for sidecars that only need the caissa binary (no agent sandbox).
# CI keeps this current with every push to Caissa main.
caissaImage: ghcr.io/miegjorn/caissa:latest
imagePullSecrets:
  - name: ghcr-creds
# caissa listen is implemented — Guilhem is alive (event listener, ~0 idle cost).
replicas: 1
farga:
  url: "http://farga.occitan-system.svc.cluster.local:7500"
  project: occitan
# Chronicle schedule — how often Guilhem wakes to observe and record.
# Uses Argo Workflows CronWorkflow syntax (standard cron).
# Kept infrequent to avoid token burn on quiet periods.
chronicleSchedule: "0 */6 * * *" # every 6 hours

sre:
  # How long to wait for a /health response before counting it as a failure (seconds).
  healthTimeoutSecs: 10
  # How often the no-LLM watchdog probes services (seconds).
  watchdogIntervalSecs: 300
  # Maximum expected age of the last chronicle signal (hours).
  # Reserved — check is deferred until Farga exposes signal timestamps.
  chronicleMaxAgeHours: 7
  # How often the LLM alert layer checks for watchdog signals and posts to Matrix.
  alertSchedule: "*/30 * * * *"
  # Matrix room ID to post alerts to. Empty = alerting disabled.
  # Set to a real room ID (e.g. !abc123:occitane.guilhem) to enable.
  matrixRoomId: ""

backlog:
  # Cron schedule for the backlog review run (weekly by default).
  reviewSchedule: "0 9 * * 1"  # Monday 09:00 America/Toronto
  # Matrix room ID to post the backlog review summary to. Empty = posting disabled.
  matrixRoomId: ""
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 2Gi
