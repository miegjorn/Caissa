---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fondament
  namespace: occitan-system
  labels:
    app: fondament
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fondament
  template:
    metadata:
      labels:
        app: fondament
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: fondament-server
          image: "{{ .Values.image }}:{{ .Values.imageTag }}"
          # imageTag is now sha-pinned by build.yml's update-caissa job on
          # every push to Fondament main (see 2026-07-02 fix) — IfNotPresent
          # avoids a redundant registry round-trip on every rollout.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: FONDAMENT_DEFINITIONS_PATH
              value: {{ .Values.definitionsPath | quote }}
            - name: FONDAMENT_PORT
              value: {{ .Values.port | quote }}
            - name: FARGA_URL
              value: {{ .Values.fargaUrl | quote }}
            - name: FONDAMENT_REGISTRY_URL
              value: {{ .Values.registryUrl | quote }}
            - name: FONDAMENT_REGISTRY_BUCKET
              value: {{ .Values.registryBucket | quote }}
            # S3 credentials for MinIO — shared secret with the minio chart
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fondament
  namespace: occitan-system
  labels:
    app: fondament
spec:
  selector:
    app: fondament
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
