apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: farga-data
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.farga.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farga
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "farga" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.farga.replicas }}
  # SQLite requires a single writer — keep replicas: 1 unless migrating to Postgres.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "farga" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "farga" "context" .) | nindent 8 }}
    spec:
      initContainers:
        # Seed the docs directory from the image on first run.
        # The image contains docs/ at /app/docs; copy to the PVC only if empty.
        - name: seed-docs
          image: {{ .Values.farga.image }}
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              if [ -z "$(ls -A /data/docs 2>/dev/null)" ]; then
                echo "Seeding Farga docs from image..."
                cp -r /app/docs/. /data/docs/
                echo "Seed complete."
              else
                echo "Docs already present, skipping seed."
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: farga
          image: {{ .Values.farga.image }}
          imagePullPolicy: Never
          command: ["farga-server"]
          ports:
            - containerPort: {{ .Values.farga.port }}
          env:
            {{- range $k, $v := .Values.farga.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.farga.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: farga-data
---
apiVersion: v1
kind: Service
metadata:
  name: farga
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "farga" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.farga.port }}
      targetPort: {{ .Values.farga.port }}
      name: http
