{{- if .Values.authentik.enabled }}
# Gardian OIDC policy — claim→scope mapping loaded by gardian-server at startup.
# issuer: internal Authentik URL (pod→pod, no DNS resolution needed).
# Post-deployment: update gardian_client_id if the OAuth2 slug differs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gardian-oidc-policy
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
data:
  oidc-policy.yaml: |
    issuer: "http://authentik:{{ .Values.authentik.port }}/application/o/gardian/"
    audience: "{{ .Values.authentik.gardianClientId }}"
    jwks_ttl_seconds: 300
    rules:
      - match:
          claim: groups
          value: occitan-admins
        grant:
          - "*"
      - match:
          claim: groups
          value: occitan-operators
        grant:
          - workspace:provision
          - audit:read
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gardian
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "gardian" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.gardian.replicas }}
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "gardian" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "gardian" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gardian
          image: {{ .Values.gardian.image }}:{{ .Values.gardian.imageTag }}
          imagePullPolicy: Always
          command: ["gardian-server"]
          ports:
            - containerPort: {{ .Values.gardian.port }}
          env:
            {{- range $k, $v := .Values.gardian.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.authentik.enabled }}
            - name: GARDIAN_OIDC_POLICY_PATH
              value: /config/oidc-policy.yaml
            {{- end }}
            {{- if .Values.openbao.enabled }}
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
            {{- end }}
          {{- if .Values.authentik.enabled }}
          volumeMounts:
            - name: oidc-policy
              mountPath: /config/oidc-policy.yaml
              subPath: oidc-policy.yaml
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gardian.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      {{- if .Values.authentik.enabled }}
      volumes:
        - name: oidc-policy
          configMap:
            name: gardian-oidc-policy
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gardian
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "gardian" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.gardian.port }}
      targetPort: {{ .Values.gardian.port }}
      name: http
