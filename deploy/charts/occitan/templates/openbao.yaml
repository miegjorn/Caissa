{{- if .Values.openbao.enabled }}
# OpenBao (MPL-2.0 fork of Vault) — the secret backend Gardian fronts.
# FILE STORAGE: data persists across pod restarts on a PVC.
#
# Init/unseal flow (fully automatic, no external dependencies):
#   First run  — entrypoint waits for port 8200 (nc -z), calls `bao operator init`,
#                writes the unseal key and root token to files on the PVC
#                (/bao/data/.unseal-key, /bao/data/.root-token), then unseals.
#   Later runs — entrypoint reads /bao/data/.unseal-key and unseals.
#
# After the FIRST deployment, run scripts/init-openbao.sh ONCE to copy the generated
# token and unseal-key from the PVC into the 'openbao' k8s Secret so Gardian's
# BAO_TOKEN env var and the Guilhem initContainer stay in sync.
#
# Security: unseal key on the PVC is acceptable for a local kind cluster.
# Production: replace with auto-unseal via KMS/HSM transit.
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "openbao" "context" .) | nindent 4 }}
  ports:
    - port: 8200
      targetPort: 8200
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-data
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.openbao.storage }}
---
# ConfigMap holds the HCL server config and the entrypoint wrapper.
# Uses only tools available in the minimal OpenBao image: sh, bao, nc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
data:
  config.hcl: |
    ui            = false
    disable_mlock = true

    storage "file" {
      path = "/bao/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr = "http://openbao:8200"

  entrypoint.sh: |
    #!/bin/sh
    # Tools available in openbao/openbao image: sh, bao, nc.  No curl/wget/python/grep.
    export BAO_ADDR=http://127.0.0.1:8200
    UNSEAL_FILE=/bao/data/.unseal-key
    TOKEN_FILE=/bao/data/.root-token

    bao server -config=/bao-config/config.hcl &
    BAO_PID=$!

    # Wait until TCP port 8200 accepts connections (nc -z exits 0 when open).
    while ! nc -z 127.0.0.1 8200 2>/dev/null; do sleep 0.3; done

    # bao status exits 0=unsealed, 1=error, 2=sealed, 3=standby.
    # Code 1 on uninitialized server — treat anything other than 0 as sealed/uninit.
    if bao status 2>/dev/null; then
      echo "[openbao] already initialised and unsealed"
    else
      if [ -f "$UNSEAL_FILE" ]; then
        # Initialised but sealed (normal pod restart): unseal with stored key.
        echo "[openbao] unsealing..."
        bao operator unseal "$(cat $UNSEAL_FILE)"
        echo "[openbao] unsealed"
      else
        # First run: initialise, save keys to PVC, unseal.
        echo "[openbao] first run — initialising..."
        INIT=$(bao operator init -key-shares=1 -key-threshold=1)
        # Parse table-format output using parameter expansion (no grep/awk needed).
        UNSEAL="" ; ROOT=""
        while IFS= read -r line; do
          case "$line" in
            "Unseal Key 1: "*)  UNSEAL="${line#Unseal Key 1: }" ;;
            "Initial Root Token: "*) ROOT="${line#Initial Root Token: }" ;;
          esac
        done <<EOF
    $INIT
    EOF
        if [ -z "$UNSEAL" ] || [ -z "$ROOT" ]; then
          echo "[openbao] ERROR: could not parse init output" >&2
          echo "$INIT" >&2
          kill $BAO_PID; exit 1
        fi
        printf '%s' "$UNSEAL" > "$UNSEAL_FILE"
        printf '%s' "$ROOT"   > "$TOKEN_FILE"
        chmod 600 "$UNSEAL_FILE" "$TOKEN_FILE"
        echo "[openbao] keys written to PVC — run scripts/init-openbao.sh to sync k8s secret"
        bao operator unseal "$UNSEAL"
        echo "[openbao] init + unseal complete. Root token: $ROOT"
      fi
    fi

    wait $BAO_PID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "openbao" "context" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "openbao" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "openbao" "context" .) | nindent 8 }}
    spec:
      # No special SA needed — init/unseal is self-contained (keys on PVC, not k8s API).
      containers:
        - name: openbao
          image: {{ .Values.openbao.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bao-config/entrypoint.sh"]
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - containerPort: 8200
              name: http
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /bao/data
            - name: config
              mountPath: /bao-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openbao-data
        - name: config
          configMap:
            name: openbao-config
            defaultMode: 0755
{{- end }}
