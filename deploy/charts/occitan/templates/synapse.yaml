apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-media
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.synapse.mediaStorage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
data:
  homeserver.yaml: |
    server_name: {{ .Values.synapse.serverName | quote }}
    pid_file: /data/homeserver.pid
    public_baseurl: {{ .Values.synapse.publicBaseurl | quote }}

    listeners:
      - port: {{ .Values.synapse.clientPort }}
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]
            compress: false
      - port: {{ .Values.synapse.federationPort }}
        tls: false
        type: http
        resources:
          - names: [client, federation]
            compress: false

    database:
      name: psycopg2
      args:
        user: {{ .Values.postgresql.auth.username }}
        password: {{ .Values.postgresql.auth.password }}
        database: {{ .Values.postgresql.auth.database }}
        host: {{ include "occitan.postgresHost" . }}
        port: 5432
        cp_min: 5
        cp_max: 10

    log_config: "/config/log.config"
    media_store_path: "/data/media_store"
    signing_key_path: "/data/{{ .Values.synapse.serverName }}.signing.key"

    enable_registration: {{ .Values.synapse.enableRegistration }}
    enable_registration_without_verification: {{ .Values.synapse.enableRegistration }}
    # Value lives in the 'synapse-registration-secret' k8s Secret (created out-of-band,
    # same as 'openbao'/'anthropic') — never inlined into this ConfigMap.
    registration_shared_secret_path: /secrets/registration-shared-secret

    {{- if .Values.authentik.enabled }}
    # Authentik OIDC SSO — active when authentik.enabled=true.
    # Prerequisites: OAuth2 application "synapse" created in Authentik UI;
    # client secret stored in 'synapse-oidc' k8s Secret (key: client-secret).
    oidc_providers:
      - idp_id: authentik
        idp_name: Authentik
        issuer: "{{ .Values.authentik.externalUrl }}/application/o/synapse/"
        client_id: "{{ .Values.authentik.synapseClientId }}"
        client_secret_path: /secrets/synapse-oidc-client-secret
        scopes: ["openid", "profile", "email"]
        user_mapping_provider:
          config:
            localpart_template: "{{ `{{ user.preferred_username }}` }}"
            display_name_template: "{{ `{{ user.name }}` }}"
    {{- end }}

    {{- if or .Values.charradissa.appservice.enabled .Values.corrier.appservice.enabled }}
    app_service_config_files:
      {{- if .Values.charradissa.appservice.enabled }}
      # Enabled once the charradissa appservice registration is provisioned onto
      # /data and the matching as-token secret exists (see charradissa.appservice
      # in values).
      - /data/charradissa-registration.yaml
      {{- end }}
      {{- if .Values.corrier.appservice.enabled }}
      # Corrièr's read gateway -- registration YAML generated by the
      # generate-corrier-registration init container below, from the
      # corrier-as-tokens secret (occitan-system namespace copy).
      - /data/corrier-registration.yaml
      {{- end }}
    {{- end }}

    federation_domain_whitelist: []
    allow_public_rooms_without_auth: true
    allow_public_rooms_over_federation: false
    report_stats: {{ .Values.synapse.reportStats }}
    trusted_key_servers: []
    suppress_key_server_warning: true

    # Single local user on a dev cluster — login throttling just gets in the way.
    rc_login:
      address:
        per_second: 1000
        burst_count: 1000
      account:
        per_second: 1000
        burst_count: 1000
      failed_attempts:
        per_second: 1000
        burst_count: 1000

  log.config: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: WARNING
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "synapse" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.synapse.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "synapse" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "synapse" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.charradissa.appservice.enabled .Values.corrier.appservice.enabled }}
      initContainers:
        {{- if .Values.charradissa.appservice.enabled }}
        - name: generate-registration
          image: {{ .Values.charradissa.image }}:{{ .Values.charradissa.imageTag }}
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - charradissa-daemon --generate-registration > /data/charradissa-registration.yaml
          env:
            - name: CHARRADISSA_CONFIG
              value: /config/charradissa.toml
            - name: CHARRADISSA_URL
              value: "http://charradissa:{{ .Values.charradissa.port }}"
            - name: MATRIX_AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: charradissa
                  key: as-token
            - name: MATRIX_HS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: charradissa
                  key: as-token
          volumeMounts:
            - name: charradissa-config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
        {{- end }}
        {{- if .Values.corrier.appservice.enabled }}
        # Writes the AS registration YAML directly (no Rust CLI entrypoint
        # exists for this yet, unlike charradissa-daemon's --generate-registration
        # -- a plain shell heredoc is simpler than adding a build/deploy round
        # trip just for this). Namespace regex/sender_localpart match
        # corrier-matrix::registration::generate_as_registration_yaml exactly.
        - name: generate-corrier-registration
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat > /data/corrier-registration.yaml <<EOF
              id: corrier
              url: http://corrier-read-gateway.agents.svc.cluster.local:8080
              as_token: ${MATRIX_AS_TOKEN}
              hs_token: ${MATRIX_HS_TOKEN}
              sender_localpart: _corrier_bridge
              namespaces:
                users:
                  - exclusive: true
                    regex: '@_corrier_.*:occitane\.guilhem'
                aliases: []
                rooms: []
              rate_limited: false
              EOF
          env:
            - name: MATRIX_AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: corrier-as-tokens
                  key: as_token
            - name: MATRIX_HS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: corrier-as-tokens
                  key: hs_token
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}
      {{- end }}
      containers:
        - name: synapse
          image: {{ .Values.synapse.image }}
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /config/homeserver.yaml
          ports:
            - containerPort: {{ .Values.synapse.clientPort }}
              name: client
            - containerPort: {{ .Values.synapse.federationPort }}
              name: federation
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: registration-secret
              mountPath: /secrets
              readOnly: true
            {{- if .Values.authentik.enabled }}
            - name: synapse-oidc-secret
              mountPath: /secrets/synapse-oidc-client-secret
              subPath: synapse-oidc-client-secret
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.synapse.clientPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: synapse-config
        - name: data
          persistentVolumeClaim:
            claimName: synapse-media
        - name: registration-secret
          secret:
            secretName: synapse-registration-secret
        {{- if .Values.authentik.enabled }}
        - name: synapse-oidc-secret
          secret:
            secretName: synapse-oidc
            items:
              - key: client-secret
                path: synapse-oidc-client-secret
        {{- end }}
        {{- if .Values.charradissa.appservice.enabled }}
        - name: charradissa-config
          configMap:
            name: charradissa-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "synapse" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.synapse.clientPort }}
      targetPort: {{ .Values.synapse.clientPort }}
      name: client
    - port: {{ .Values.synapse.federationPort }}
      targetPort: {{ .Values.synapse.federationPort }}
      name: federation
