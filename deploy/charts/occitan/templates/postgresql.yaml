{{- if .Values.postgresql.enabled }}
# Official postgres image (bitnami chart images are no longer pullable from Docker Hub).
# Single instance backing Synapse. Service name matches the occitan.postgresHost helper.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "occitan.postgresHost" . }}
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "postgresql" "context" .) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "occitan.postgresHost" . }}
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "postgresql" "context" .) | nindent 4 }}
spec:
  serviceName: {{ include "occitan.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "postgresql" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "postgresql" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          # Public image — let the node pull it from Docker Hub.
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            # Synapse requires C collation/ctype; applied at initdb time.
            - name: POSTGRES_INITDB_ARGS
              value: {{ .Values.postgresql.initdbArgs | quote }}
            # Subdir keeps initdb happy when the PVC root has lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.authentik.enabled }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      {{- if .Values.authentik.enabled }}
      volumes:
        - name: init-scripts
          configMap:
            name: postgresql-init-scripts
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
---
{{- if and .Values.postgresql.enabled .Values.authentik.enabled }}
# Init script: creates the 'authentik' database and user on FIRST PostgreSQL
# initialisation. Has no effect if the PVC already contains initialised data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
data:
  01-authentik-db.sql: |
    -- Create Authentik database and user.
    -- Password must match values.authentik.postgresql.password and the
    -- 'authentik' k8s Secret key 'postgresql-password'.
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = {{ .Values.authentik.postgresql.user | squote }}) THEN
        CREATE USER {{ .Values.authentik.postgresql.user }} WITH PASSWORD {{ .Values.authentik.postgresql.password | squote }};
      END IF;
    END
    $$;
    SELECT 'CREATE DATABASE {{ .Values.authentik.postgresql.database }} OWNER {{ .Values.authentik.postgresql.user }}'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = {{ .Values.authentik.postgresql.database | squote }})\gexec
    GRANT ALL PRIVILEGES ON DATABASE {{ .Values.authentik.postgresql.database }} TO {{ .Values.authentik.postgresql.user }};
{{- end }}
