apiVersion: v1
kind: ConfigMap
metadata:
  name: charradissa-config
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
data:
  charradissa.toml: |
    [org]
    name = {{ .Values.charradissa.config.org.name | quote }}
    homeserver = {{ .Values.charradissa.config.org.homeserver | quote }}

    [backend]
    type = {{ .Values.charradissa.config.backend.type | quote }}

    [concierge]
    archival_interval_hours = {{ .Values.charradissa.config.concierge.archival_interval_hours }}
    convergence_interval_hours = {{ .Values.charradissa.config.concierge.convergence_interval_hours }}
    daily_token_budget = {{ .Values.charradissa.config.concierge.daily_token_budget }}

    [approval]
    timeout_minutes = {{ .Values.charradissa.config.approval.timeout_minutes }}

    [tasks]
    type = {{ .Values.charradissa.config.tasks.type | quote }}

    [projects]
    autodiscover = {{ .Values.charradissa.config.projects.autodiscover }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: charradissa
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
    {{- include "occitan.selectorLabels" (dict "component" "charradissa" "context" .) | nindent 4 }}
spec:
  # Stays at 0 until the Matrix appservice is wired (needs the 'charradissa' secret).
  replicas: {{ if .Values.charradissa.appservice.enabled }}{{ .Values.charradissa.replicas }}{{ else }}0{{ end }}
  selector:
    matchLabels:
      {{- include "occitan.selectorLabels" (dict "component" "charradissa" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "occitan.selectorLabels" (dict "component" "charradissa" "context" .) | nindent 8 }}
    spec:
      # The daemon reads CHARRADISSA_PORT for its listen port, which collides with
      # the kubelet's legacy service-link env var (<SVCNAME>_PORT=tcp://ip:port).
      # Disable service links so the daemon's "8448" default applies. (Code fix:
      # rename the env var to a non-colliding name — tracked for the daemon rebuild.)
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Pull SYNAPSE_ADMIN_TOKEN from OpenBao into a shared creds volume, same
        # pattern as agents/guilhem's fetch-tokens: OpenBao stays the source of
        # truth, nothing duplicated into a long-lived k8s secret.
        - name: fetch-synapse-admin-token
          image: openbao/openbao:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export BAO_ADDR=http://openbao.occitan-system.svc.cluster.local:8200
              TOKEN=$(bao kv get -field=value secret/occitan/synapse-admin-token)
              umask 077
              printf 'export SYNAPSE_ADMIN_TOKEN=%s\n' "$TOKEN" > /creds/synapse-admin-token.env
              echo "synapse admin token written to /creds"
          env:
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao
                  key: token
          volumeMounts:
            - name: creds
              mountPath: /creds
      containers:
        - name: charradissa
          image: {{ .Values.charradissa.image }}:{{ .Values.charradissa.imageTag }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /creds/synapse-admin-token.env ] && . /creds/synapse-admin-token.env
              exec charradissa-daemon
          ports:
            - containerPort: {{ .Values.charradissa.port }}
          env:
            {{- range $k, $v := .Values.charradissa.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic
                  key: api-key
            - name: MATRIX_AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: charradissa
                  key: as-token
            - name: FARGA_URL
              value: "http://farga:{{ .Values.farga.port }}"
            - name: SYNAPSE_URL
              value: "http://synapse:{{ .Values.synapse.clientPort }}"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: creds
              mountPath: /creds
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.charradissa.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: charradissa-config
        - name: creds
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: charradissa
  namespace: occitan-system
  labels:
    {{- include "occitan.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "occitan.selectorLabels" (dict "component" "charradissa" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.charradissa.port }}
      targetPort: {{ .Values.charradissa.port }}
      name: appservice
