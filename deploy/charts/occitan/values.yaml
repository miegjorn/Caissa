# Occitan stack — Helm values
# Override per environment: helm upgrade occitan ./charts/occitan -f values.prod.yaml

imagePullSecrets:
  - name: ghcr-creds
# ─── Gardian ─────────────────────────────────────────────────────────────────
gardian:
  image: ghcr.io/miegjorn/gardian
  imageTag: sha-311d8d0 # CI writes sha-<sha> here on every main push
  replicas: 1
  # gardian-server currently hardcodes 0.0.0.0:7400 and ignores GARDIAN_PORT.
  # TODO(gardian): make gardian-server honour GARDIAN_PORT, then this can move.
  port: 7400
  env:
    GARDIAN_MODE: server
    GARDIAN_PORT: "7400"
    # OpenBao backend: when BAO_ADDR is set gardian-server fronts OpenBao instead of .env.
    BAO_ADDR: "http://openbao:8200"
    BAO_MOUNT: secret
    BAO_FIELD: value
    # BAO_TOKEN is injected from the 'openbao' secret (see gardian deployment template).
# ─── OpenBao (secret backend Gardian fronts) ─────────────────────────────────
openbao:
  enabled: true
  image: openbao/openbao:latest
  storage: 1Gi
# ─── Farga ───────────────────────────────────────────────────────────────────
farga:
  image: ghcr.io/miegjorn/farga
  imageTag: sha-f361b23 # CI writes sha-<sha> here on every main push
  replicas: 1
  port: 7500
  storage: 5Gi
  env:
    FARGA_PORT: "7500"
    FARGA_DB: /data/farga.db
    FARGA_DOCS: /data/docs
# ─── Amassada ────────────────────────────────────────────────────────────────
# Canvases are baked into the image at /canvases/stdlib.
amassada:
  image: ghcr.io/miegjorn/amassada
  imageTag: sha-2884c0b # CI writes sha-<sha> here on every main push
  replicas: 1
  port: 7700
  env:
    AMASSADA_PORT: "7700"
    AMASSADA_CANVAS_DIR: /canvases/stdlib
    # ANTHROPIC_API_KEY is injected from the 'anthropic' secret (key: api-key).
# ─── Charradissa ─────────────────────────────────────────────────────────────
charradissa:
  image: ghcr.io/miegjorn/charradissa
  imageTag: sha-60bf22f # CI writes sha-<sha> here on every main push
  replicas: 1
  port: 8448
  env:
    CHARRADISSA_CONFIG: /config/charradissa.toml
    GUILHEM_URL: "http://guilhem.agents.svc.cluster.local:8080"
  # Matrix appservice wiring. While disabled, Synapse starts without the
  # charradissa registration and charradissa stays scaled to 0 (it needs the
  # 'charradissa' secret with key as-token). Enable once the registration file
  # and matching token are provisioned. See TODO in deploy notes.
  appservice:
    enabled: true
  config:
    org:
      name: occitan
      homeserver: "http://synapse:8008"
    backend:
      type: matrix
    concierge:
      archival_interval_hours: 24
      convergence_interval_hours: 6
      daily_token_budget: 100000
    approval:
      timeout_minutes: 60
    tasks:
      type: none
    projects:
      autodiscover: false
    agents:
      # Default route — Guilhem handles all rooms that have no explicit route.
      default: "http://guilhem.agents.svc.cluster.local:8080"
      # Per-room routes → independent component agent pods (deploy/charts/component-agents).
      routes:
        - roomId: "!hNBIrYgqZxPsnBntbY:occitane.guilhem"
          agentUrl: "http://gardian-agent.agents.svc.cluster.local:8080"
        - roomId: "!yYNPBBfRcPAMfpyAeB:occitane.guilhem"
          agentUrl: "http://fondament-agent.agents.svc.cluster.local:8080"
        - roomId: "!kIDEzlMzVRRXveGVpL:occitane.guilhem"
          agentUrl: "http://farga-agent.agents.svc.cluster.local:8080"
        - roomId: "!AftizZpcNgfIUgqFQt:occitane.guilhem"
          agentUrl: "http://amassada-agent.agents.svc.cluster.local:8080"
        - roomId: "!SRtFNNEbgkATYOLktl:occitane.guilhem"
          agentUrl: "http://cor-agent.agents.svc.cluster.local:8080"
        - roomId: "!fquiGtdiWSOUyYhYUV:occitane.guilhem"
          agentUrl: "http://caissa-agent.agents.svc.cluster.local:8080"
        - roomId: "!tGdWTCTRPPXgnWrhad:occitane.guilhem"
          agentUrl: "http://charradissa-agent.agents.svc.cluster.local:8080"
          # ANTHROPIC_API_KEY from 'anthropic' secret; MATRIX_AS_TOKEN from 'charradissa' secret.
# ─── Synapse (Matrix homeserver) ─────────────────────────────────────────────
synapse:
  image: matrixdotorg/synapse:latest
  replicas: 1
  serverName: occitane.guilhem
  publicBaseurl: "http://occitane.guilhem:8008"
  clientPort: 8008
  federationPort: 8448
  mediaStorage: 10Gi
  # Registration is open by default for local dev. Disable in production:
  enableRegistration: true
  reportStats: false
# ─── PostgreSQL (Synapse database) ───────────────────────────────────────────
# In-chart StatefulSet using the official postgres image (templates/postgresql.yaml).
postgresql:
  enabled: true
  image: postgres:15-alpine
  auth:
    username: synapse
    password: synapse # override via --set or sealed secrets in production
    database: synapse
  persistence:
    size: 8Gi
  # Required by Synapse — C collation/ctype at initdb time.
  initdbArgs: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
# ─── Element Web (Matrix client) ─────────────────────────────────────────────
element:
  image: vectorim/element-web:latest
  replicas: 1
  port: 80
  brand: "Occitan"
