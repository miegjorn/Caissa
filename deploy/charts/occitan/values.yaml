# Occitan stack — Helm values
# Override per environment: helm upgrade occitan ./charts/occitan -f values.prod.yaml

imagePullSecrets:
  - name: ghcr-creds
# ─── Gardian ─────────────────────────────────────────────────────────────────
gardian:
  image: ghcr.io/miegjorn/gardian
  imageTag: sha-0f7feb5 # CI writes sha-<sha> here on every main push
  replicas: 1
  # gardian-server currently hardcodes 0.0.0.0:7400 and ignores GARDIAN_PORT.
  # TODO(gardian): make gardian-server honour GARDIAN_PORT, then this can move.
  port: 7400
  env:
    GARDIAN_MODE: server
    GARDIAN_PORT: "7400"
    # OpenBao backend: when BAO_ADDR is set gardian-server fronts OpenBao instead of .env.
    BAO_ADDR: "http://openbao:8200"
    BAO_MOUNT: secret
    BAO_FIELD: value
    # BAO_TOKEN is injected from the 'openbao' secret (see gardian deployment template).
# ─── OpenBao (secret backend Gardian fronts) ─────────────────────────────────
openbao:
  enabled: true
  image: openbao/openbao:latest
  storage: 1Gi
# ─── Farga ───────────────────────────────────────────────────────────────────
farga:
  image: ghcr.io/miegjorn/farga
  imageTag: sha-40e27e7 # CI writes sha-<sha> here on every main push
  replicas: 1
  port: 7500
  storage: 5Gi
  env:
    FARGA_PORT: "7500"
    FARGA_DB: /data/farga.db
    FARGA_DOCS: /data/docs
# ─── Tick poller (self-paced periodic-skill wake delivery) ───────────────────
tickPoller:
  image: ghcr.io/miegjorn/caissa
  imageTag: latest # CI writes sha-<sha> here on every main push, matching guilhem's own imageTag convention
# ─── Corrièr ──────────────────────────────────────────────────────────────────
# Matrix Application Service registration -- as_token/hs_token live in the
# 'corrier-as-tokens' k8s secret (agents namespace), read directly by the
# init container below rather than templated through Helm values.
corrier:
  appservice:
    enabled: true
# ─── Charradissa ─────────────────────────────────────────────────────────────
charradissa:
  image: ghcr.io/miegjorn/charradissa
  imageTag: sha-6109765 # CI writes sha-<sha> here on every main push
  replicas: 1
  port: 8448
  # Matrix room ID for the shared code-approval room. Agents call matrix_request_approval
  # which posts here; humans reply /approve <id> or /reject <id> <reason>.
  approvalRoomId: "!fXqxTadpzocBjuTaPn:occitane.guilhem"
  env:
    CHARRADISSA_CONFIG: /config/charradissa.toml
    GUILHEM_URL: "http://guilhem.agents.svc.cluster.local:8080"
  # Appservice is active — charradissa token provisioned in the 'charradissa' secret.
  appservice:
    enabled: true
  config:
    org:
      name: occitan
      homeserver: "http://synapse:8008"
    backend:
      type: matrix
    concierge:
      archival_interval_hours: 24
      convergence_interval_hours: 6
      daily_token_budget: 100000
    approval:
      timeout_minutes: 60
    tasks:
      type: none
    projects:
      autodiscover: false
    agents:
      # Default route — Guilhem handles all rooms that have no explicit route.
      default: "http://guilhem.agents.svc.cluster.local:8080"
      # Project-routed rooms (Amassada-backed dispatch, retired 2026-07-04 —
      # see Amassada README's retirement note). No replacement decided for
      # room !zSeBDhFjVObXNpqAtF:occitane.guilhem yet; left unrouted
      # (falls back to `default` above) rather than guessing a replacement —
      # one-time continuity loss accepted on cutover, matching the Corrièr
      # precedent.
      projectRoutes: []
      # Component agents now run independent Matrix sessions — Charradissa
      # no longer relays for their rooms (see Occitan#per-agent-matrix-independence).
      # This list intentionally empty; Task 8's skip-list guard in
      # charradissa-matrix/src/appservice.rs stops the default-agent-url
      # fallback from picking these rooms up regardless.
      routes: []
      # ANTHROPIC_API_KEY from 'anthropic' secret; MATRIX_AS_TOKEN from 'charradissa' secret.
# ─── Valkey (Redis-compatible cache for Authentik) ────────────────────────────
valkey:
  enabled: true
  image: valkey/valkey:7-alpine
  memoryLimit: 256Mi
# ─── Authentik (OIDC identity provider) ──────────────────────────────────────
# Disabled by default — enable after:
#   1. openBao is seeded with bootstrap credentials (scripts/init-openbao.sh)
#   2. 'authentik' k8s Secret exists (secret-key, postgresql-password, bootstrap-password)
#   3. 'synapse-oidc' k8s Secret exists (client-secret) — after Authentik setup
#
# Authentik → Gardian OIDC: uses internal URL (pod→pod, no ingress needed).
# Authentik → Synapse OIDC: uses external URL (browser redirect — needs DNS/LoadBalancer).
authentik:
  enabled: false
  image: ghcr.io/goauthentik/server
  imageTag: "2024.12.2"
  port: 9000
  # External URL for Synapse OIDC (browser-side). Requires DNS or /etc/hosts on client.
  # For kind + metallb: set to http://<metallb-LB-IP>:9000
  externalUrl: "http://occitane.guilhem:9000"
  postgresql:
    database: authentik
    user: authentik
    # Password: must match 'authentik' k8s Secret key 'postgresql-password'.
    # Not a production secret — override per environment.
    password: authentik
  # OAuth2 application slugs (set after creating applications in Authentik UI)
  gardianClientId: "gardian"
  synapseClientId: "synapse"
# ─── Synapse (Matrix homeserver) ─────────────────────────────────────────────
synapse:
  image: matrixdotorg/synapse:latest
  replicas: 1
  serverName: occitane.guilhem
  publicBaseurl: "http://occitane.guilhem:8008"
  clientPort: 8008
  federationPort: 8448
  mediaStorage: 10Gi
  # Registration is open by default for local dev. Disable in production:
  enableRegistration: true
  reportStats: false
# ─── Kroki (server-side diagram rendering) ────────────────────────────────────
kroki:
  enabled: true
  image: yuzutech/kroki:latest
  mermaidImage: yuzutech/kroki-mermaid:latest
  port: 8000
# ─── PostgreSQL (Synapse database) ───────────────────────────────────────────
# In-chart StatefulSet using the official postgres image (templates/postgresql.yaml).
postgresql:
  enabled: true
  image: postgres:15-alpine
  auth:
    username: synapse
    password: synapse # override via --set or sealed secrets in production
    database: synapse
  persistence:
    size: 8Gi
  # Required by Synapse — C collation/ctype at initdb time.
  initdbArgs: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
# ─── Element Web (Matrix client) ─────────────────────────────────────────────
element:
  image: vectorim/element-web:latest
  replicas: 1
  port: 80
  brand: "Occitan"
# ─── Matrix Bootstrap Job ────────────────────────────────────────────────────
matrixBootstrap:
  # Lean CLI image (just the caissa binary, no agent sandbox) -- the same
  # image guilhem's chart calls caissaImage for sidecars that only need to
  # run one caissa subcommand. Must NOT be the heavy caissa-sandbox image
  # (that's a different build, doesn't need to track this one's tag at all).
  image: ghcr.io/miegjorn/caissa:latest
  imagePullSecrets:
    - name: ghcr-creds
# no-op: branch-protection gate verification 2026-07-01T17:02:23Z
# no-op: guilhem-bot identity verification 2026-07-01T18:49:58Z
# no-op: guilhem-bot round-2 verification (post-fix) 2026-07-01T20:59:59Z
