# MetalLB L2 IP address pool for the kind cluster.
# Must match the subnet Docker assigned to the 'kind' bridge network.
# Check yours with: docker network inspect kind | grep Subnet
# Current kind network: 172.19.0.0/16  (was incorrectly set to 172.18.x)
#
# Applied after MetalLB is installed:
#   kubectl apply -f deploy/kind/metallb-pool.yaml
#   kubectl delete svc synapse -n occitan-system && kubectl apply ... (to get new IP)
#   OR: kubectl patch svc synapse -n occitan-system -p '{"spec":{"type":"LoadBalancer"}}'

apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: occitan-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.19.0.200-172.19.0.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: occitan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - occitan-pool
