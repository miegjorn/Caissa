apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: occitan
  source:
    repoURL: ssh://git@ssh.github.com:443/miegjorn/Caissa.git
    targetRevision: main
    path: deploy/charts/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: occitan-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # Kubernetes auto-adds volumeMode: Filesystem to StatefulSet PVC templates.
    # Helm template doesn't set it → ArgoCD sees permanent false drift.
    - group: apps
      kind: StatefulSet
      name: minio
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
