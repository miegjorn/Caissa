apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: component-agents
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: occitan
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: occitan

  source:
    repoURL: ssh://git@ssh.github.com:443/miegjorn/Caissa.git
    targetRevision: HEAD
    path: deploy/charts/component-agents
    helm:
      releaseName: component-agents
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: agents

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
