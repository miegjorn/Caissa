apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dispatcher
  namespace: argocd
spec:
  project: occitan
  source:
    repoURL: https://github.com/bedardpl/Caissa.git
    targetRevision: main
    path: deploy/charts/dispatcher
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
