apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nervi
  namespace: argocd
spec:
  project: occitan
  source:
    repoURL: ssh://git@ssh.github.com:443/miegjorn/nervi.git
    targetRevision: main
    path: deploy
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: occitan-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
