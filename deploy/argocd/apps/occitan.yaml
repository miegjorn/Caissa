apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: occitan
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: occitan
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: occitan

  source:
    repoURL: ssh://git@ssh.github.com:443/miegjorn/Caissa.git
    targetRevision: HEAD
    path: deploy/charts/occitan
    helm:
      releaseName: occitan
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: occitan-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    # Synapse signing key is generated on first run — ignore drift.
    - group: ""
      kind: Secret
      name: synapse-signing-key
      jsonPointers:
        - /data
    # Kubernetes auto-adds volumeMode: Filesystem to StatefulSet PVC templates.
    # Helm template doesn't set it → ArgoCD sees permanent false drift.
    - group: apps
      kind: StatefulSet
      name: occitan-postgresql
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
